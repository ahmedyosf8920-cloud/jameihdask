<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة طلبات الحالات | جمعية الخير للجميع</title><script src="config.js"></script><style>
body{font-family:Tahoma,Arial,sans-serif;background:#f3f8f5;color:#173d2d;margin:0}.wrap{max-width:1150px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9e9e0;border-radius:16px;padding:16px;margin:12px 0}h1,h2,h3{color:#075b3a;margin:6px 0}
input,select,textarea{font:inherit;padding:10px;border:1px solid #d4e3da;border-radius:9px;max-width:100%;box-sizing:border-box}button{font:inherit;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:#16864b;color:#fff;margin:2px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8f4ec;color:#075b3a}.danger{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px;margin:10px 0}.hidden{display:none!important}.small{font-size:12px;color:#687a70}
#flash{position:sticky;top:6px;z-index:5;padding:12px 14px;border-radius:12px;margin:10px 0;font-weight:700;background:#e4f5ea;border:1px solid #9fd5b1;color:#075b3a}#flash.err{background:#fde8e6;border-color:#f0a8a0;color:#9b2c20}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #cfe3d6;background:#fff;color:#075b3a;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}.chip b{background:#075b3a;color:#fff;border-radius:99px;padding:1px 9px;margin-right:6px}.chip.warn{border-color:#f0c36a;background:#fff9e8}
.tbl{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:right;padding:9px;border-bottom:1px solid #e5eee8;vertical-align:top;font-size:14px}th{background:#eaf5ed;white-space:nowrap}.empty{padding:14px;color:#687a70}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.kv{display:grid;grid-template-columns:140px 1fr;gap:5px 10px;font-size:14px}.kv b{color:#4c6a5a}.badge{display:inline-block;padding:3px 10px;border-radius:99px;background:#eaf5ed;font-size:13px}
#detail{border:2px solid #16864b}.decide{display:grid;gap:8px;margin-top:12px;max-width:560px}.decide textarea{min-height:70px}.docs a{margin:4px 10px;display:inline-block}
@media(max-width:650px){.wrap{padding:8px}.card{padding:10px}.kv{grid-template-columns:105px 1fr}}
</style><script src="jkh-look.js?v=33"></script></head><body><div class="wrap"><h1>مراجعة طلبات الحالات</h1><p class="small">للموظفين المخولين فقط (مدير النظام أو المؤسسين أو الباحث الاجتماعي). قرارك وسببه يظهران لصاحب الطلب عند المتابعة بالرقم القومي في بوابة التسجيل.</p>
<section id="login" class="card"><h2>تسجيل دخول الموظف</h2><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" onclick="loadRequests()">دخول وعرض الطلبات</button><div id="loginMsg" class="small" style="margin-top:8px"></div></section>
<section id="dashboard" class="hidden">
<div class="card"><div class="row"><h2 style="flex:1;margin:0">طلبات الحالات</h2><button id="refreshBtn" class="secondary" onclick="loadRequests(true)">🔄 تحديث الحالات</button><button class="secondary" onclick="logout()">تسجيل خروج</button></div><div id="chips" class="chips"></div></div>
<div id="flash" class="hidden"></div>
<section id="detail" class="card hidden"></section>
<div id="tables"></div></section></div>
<script>
const ENDPOINT=(window.JKH_SUPABASE_URL||"https://fpujicazthxvfodgjyui.supabase.co").replace(/\/$/,"")+"/functions/v1/applicant-portal",APIKEY=(window.JKH_SUPABASE_ANON_KEY||"sb_publishable_LKc8ByQL58bEH674K1f5pA_oyAy44Ol");
const GROUPS=[["مرفوض","❌ الحالات المرفوضة","#c0392b"],["مقبول","✅ الحالات المقبولة","#16864b"],["تحت المراجعة","⏳ الحالات تحت المراجعة","#e0a100"],["موقوف","⏸️ الحالات الموقوفة","#7a6a99"]];
let REQS=[],openId=null;
const el=id=>document.getElementById(id);
function flash(t,err){const f=el("flash");f.textContent=t;f.className=err?"err":"";f.classList.remove("hidden");if(!err)setTimeout(()=>{if(f.textContent===t)f.classList.add("hidden")},7000);f.scrollIntoView({block:"nearest"})}
async function call(action,extra={}){const f=new FormData();f.set("action",action);f.set("username",el("username").value.trim());f.set("password",el("password").value);for(const [k,v] of Object.entries(extra))f.set(k,String(v));let r;try{r=await fetch(ENDPOINT,{method:"POST",headers:{apikey:APIKEY},body:f})}catch(e){throw Error("تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة.")}let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"تعذر تنفيذ العملية.");return d}
async function loadRequests(manual){const b1=el("loginBtn"),b2=el("refreshBtn");b1.disabled=b2.disabled=true;if(manual)b2.textContent="⏳ جارٍ التحديث…";try{if(!el("password").value)throw Error("انتهت الجلسة. سجّل الدخول من جديد.");const d=await call("staff_list");REQS=d.requests||[];el("login").classList.add("hidden");el("dashboard").classList.remove("hidden");render();if(manual)flash("تم تحديث القائمة ("+REQS.length+" طلب).")}catch(e){if(el("dashboard").classList.contains("hidden")){el("loginMsg").textContent=e.message;el("loginMsg").style.color="#9b2c20"}else flash(e.message,true);if(/انتهت|غير صحيحة|يلزم/.test(e.message))logout(e.message)}finally{b1.disabled=b2.disabled=false;b2.textContent="🔄 تحديث الحالات"}}
function mk(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function inMain(){try{return window.parent!==window&&typeof window.parent.addPortalCase==="function"}catch(e){return false}}
function added(x){try{return window.parent!==window&&typeof window.parent.hasPortalCase==="function"&&window.parent.hasPortalCase(x.case_number)}catch(e){return false}}
function fmt(d){return d?new Date(d).toLocaleDateString("ar-EG"):""}
function render(){const ch=el("chips");ch.innerHTML="";const box=el("tables");box.innerHTML="";
 for(const [st,title,col] of GROUPS){const list=REQS.filter(x=>(x.file_status||"تحت المراجعة")===st);
  const c=mk("button",title.replace(/^\S+\s/,""),"chip"+(st==="تحت المراجعة"&&list.length?" warn":""));c.appendChild(mk("b",String(list.length)));c.onclick=()=>el("g_"+st).scrollIntoView({behavior:"smooth"});ch.appendChild(c);
  const sec=mk("section",undefined,"card");sec.id="g_"+st;const h=mk("div",undefined,"sec-h");const dot=mk("span",undefined,"dot");dot.style.background=col;h.append(dot,mk("h3",title+" ("+list.length+")"));sec.appendChild(h);
  if(!list.length){sec.appendChild(mk("div","لا توجد طلبات في هذه الحالة.","empty"));box.appendChild(sec);continue}
  const wrap=mk("div",undefined,"tbl"),t=mk("table"),thead=mk("thead"),hr=mk("tr");for(const n of["م","رقم الطلب","الاسم","الهاتف","المنطقة","المساعدة","تاريخ التقديم","آخر رد","إجراءات"])hr.appendChild(mk("th",n));thead.appendChild(hr);t.appendChild(thead);const tb=mk("tbody");
  list.forEach((x,i)=>{const p=x.applicant_payload||{},tr=mk("tr");for(const v of[String(i+1),x.case_number,p.name||"—",p.phone||"",p.area||"",p.need||"",fmt(x.created_at),x.decision_reason||""])tr.appendChild(mk("td",v));
   const td=mk("td"),open=mk("button",st==="تحت المراجعة"?"فتح والرد":"عرض / تعديل القرار");open.onclick=()=>openReq(x.id);td.appendChild(open);
   if(st==="مقبول"){if(added(x))td.appendChild(mk("span","✓ مضافة للحالات","badge"));else{const a=mk("button","إضافة إلى الحالات");a.onclick=()=>addToCases(x);td.appendChild(a)}}
   tr.appendChild(td);tb.appendChild(tr)});
  t.appendChild(tb);wrap.appendChild(t);sec.appendChild(wrap);box.appendChild(sec)}
 if(openId&&REQS.some(x=>x.id===openId))openReq(openId,true);else closeDetail()}
function closeDetail(){openId=null;el("detail").classList.add("hidden")}
function openReq(id,keep){const x=REQS.find(r=>r.id===id);if(!x)return;openId=id;const p=x.applicant_payload||{},d=el("detail");d.innerHTML="";d.classList.remove("hidden");
 const top=mk("div",undefined,"row");top.append(mk("h2",(p.name||"—")+" — "+x.case_number),mk("span",x.file_status||"تحت المراجعة","badge"));const cl=mk("button","إغلاق","secondary");cl.style.marginRight="auto";cl.onclick=closeDetail;top.appendChild(cl);d.appendChild(top);
 const kv=mk("div",undefined,"kv");for(const [k,v] of [["الهاتف",p.phone],["الرقم القومي","••••••••••"+(p.national_id_last4||"")],["الزوجة",p.wife],["هاتف الزوجة",p.wife_phone],["العنوان",p.address],["المنطقة",p.area],["الحالة الاجتماعية",p.social],["عدد الأفراد",p.members],["المساعدة المطلوبة",p.need],["شرح الحالة",p.notes],["تاريخ التقديم",x.created_at?new Date(x.created_at).toLocaleString("ar-EG"):""],["الرد الحالي",x.decision_reason]]){if(v===undefined||v===null||v==="")continue;kv.append(mk("b",k),mk("span",String(v)))}d.appendChild(kv);
 const db=mk("button","📎 عرض المستندات ("+((x.document_paths||[]).length)+")","secondary");db.onclick=()=>showDocs(x.id);d.appendChild(db);d.appendChild(mk("div",undefined,"docs")).id="docbox";
 const dec=mk("div",undefined,"decide"),sel=mk("select");for(const s of["مقبول","مرفوض","تحت المراجعة","موقوف"])sel.appendChild(mk("option",s));sel.value=x.file_status||"تحت المراجعة";
 const ta=mk("textarea");ta.placeholder="سبب القرار أو رد للمتقدم (مطلوب)";ta.maxLength=1000;ta.value=x.decision_reason||"";
 const sv=mk("button","حفظ القرار والرد");sv.onclick=()=>decide(x,sel.value,ta.value,sv);dec.append(mk("label","القرار"),sel,mk("label","الرد الذي يظهر لصاحب الطلب"),ta,sv);d.appendChild(dec);if(!keep)d.scrollIntoView({behavior:"smooth"})}
async function showDocs(id){const box=el("docbox");box.textContent="جارٍ التحميل…";try{const d=await call("staff_documents",{id});box.innerHTML="";if(!(d.documents||[]).length){box.textContent="لا توجد مستندات مرفقة.";return}for(const f of d.documents){const a=mk("a",f.name||"ملف");a.href=f.url;a.target="_blank";a.rel="noopener";box.appendChild(a)}}catch(e){box.textContent="";flash(e.message,true)}}
async function decide(x,status,reason,btn){if(!reason.trim()){flash("اكتب سبب القرار أو الرد أولًا.",true);return}btn.disabled=true;btn.textContent="جارٍ الحفظ…";try{await call("staff_decide",{id:x.id,file_status:status,decision_reason:reason});openId=null;closeDetail();await loadRequests();flash("تم حفظ القرار — نُقل الطلب إلى جدول: "+status+". الرد يظهر لصاحب الطلب عند المتابعة.");
  if(status==="مقبول"){const fresh=REQS.find(r=>r.id===x.id)||x;if(!added(fresh)&&confirm("تم قبول الطلب. هل تريد إضافته الآن إلى سجل الحالات؟"))await addToCases(fresh)}}catch(e){flash(e.message,true)}finally{btn.disabled=false;btn.textContent="حفظ القرار والرد"}}
async function addToCases(x){if(!inMain()){flash("الإضافة إلى الحالات تتم من داخل النظام الرئيسي: افتح قسم المستفيدون والحالات ثم «مراجعة طلبات البوابة».",true);return}try{const r=await window.parent.addPortalCase(x);flash(r&&r.exists?"هذه الحالة مضافة من قبل في سجل الحالات.":"تمت إضافة الحالة إلى سجل الحالات (الرقم القومي الكامل يُستكمل يدويًا من ملف الحالة).");render()}catch(e){flash(e.message||"تعذرت الإضافة.",true)}}
function logout(msg){el("password").value="";REQS=[];openId=null;el("dashboard").classList.add("hidden");el("login").classList.remove("hidden");if(typeof msg==="string"){el("loginMsg").textContent=msg;el("loginMsg").style.color="#9b2c20"}}
try{const c=window.parent!==window&&window.parent.__inboxCred;if(c){el("username").value=c.u;el("password").value=c.p;loadRequests()}}catch(e){}
</script></body></html>
