<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>روابط جمعية الخير للجميع</title>
<style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f7f3;color:#193326}.w{max-width:640px;margin:auto;padding:16px}h1{color:#11663a;text-align:center;font-size:22px}.c{background:#fff;border:1px solid #e4eee7;border-radius:14px;padding:14px;margin:10px 0}.c b{display:block;margin-bottom:4px}.u{direction:ltr;text-align:left;font-size:12px;color:#587;word-break:break-all;margin:6px 0}a,button{display:inline-block;font:inherit;border:0;border-radius:9px;padding:9px 14px;margin:2px;text-decoration:none;cursor:pointer;background:#18864b;color:#fff}button{background:#eaf4ed;color:#155f38}</style><script src="jkh-look.js?v=33"></script></head><body><div class="w"><h1>روابط جمعية الخير للجميع</h1><div id="l"></div></div>
<script>const items=[["النظام (للموظفين)","index.html"],["تسجيل المتطوعين (للنشر)","volunteer.html"],["مراجعة طلبات المتطوعين","volunteer-admin.html"],["بوابة تسجيل الحالات","portal.html"],["مراجعة طلبات الحالات","applicant-admin.html"],["متجر التبرعات","donation-store.html"],["إدارة متجر التبرعات","donation-admin.html"]];
const base=new URL('.',location.href).href;const box=document.getElementById('l');
items.forEach(([t,f])=>{const u=base+f,d=document.createElement('div');d.className='c';const b=document.createElement('b');b.textContent=t;const p=document.createElement('div');p.className='u';p.textContent=u;const a=document.createElement('a');a.href=u;a.target='_blank';a.textContent='فتح';const c=document.createElement('button');c.textContent='نسخ الرابط';c.onclick=()=>{navigator.clipboard.writeText(u).then(()=>{c.textContent='تم النسخ';setTimeout(()=>c.textContent='نسخ الرابط',1500)},()=>prompt('انسخ الرابط:',u))};d.append(b,p,a,c);box.appendChild(d)});</script></body></html>
