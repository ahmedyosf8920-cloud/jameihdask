<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة طلبات المتطوعين | جمعية الخير للجميع</title><script src="config.js"></script><script src="jkh-docs.js?v=30"></script><style>
body{font-family:Tahoma,Arial,sans-serif;background:#f3f8f5;color:#173d2d;margin:0}.wrap{max-width:1150px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9e9e0;border-radius:16px;padding:16px;margin:12px 0}h1,h2,h3{color:#075b3a;margin:6px 0}
input,select,textarea{font:inherit;padding:10px;border:1px solid #d4e3da;border-radius:9px;max-width:100%;box-sizing:border-box}button{font:inherit;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:#16864b;color:#fff;margin:2px}button:disabled{opacity:.55}.secondary{background:#e8f4ec;color:#075b3a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px;margin:10px 0}.hidden{display:none!important}.small{font-size:12px;color:#687a70}
#flash{padding:12px;border-radius:12px;margin:10px 0;font-weight:700;background:#e4f5ea;color:#075b3a}#flash.err{background:#fde8e6;color:#9b2c20}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cfe3d6;background:#fff;color:#075b3a;border-radius:99px;padding:8px 14px;font-weight:700}.chip b{background:#075b3a;color:#fff;border-radius:99px;padding:1px 9px;margin-right:6px}
.tbl{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:right;padding:9px;border-bottom:1px solid #e5eee8;font-size:14px;vertical-align:top}th{background:#eaf5ed;white-space:nowrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 10px;font-size:14px}.kv b{color:#4c6a5a}#detail{border:2px solid #16864b}.decide{display:grid;gap:8px;margin-top:12px;max-width:560px}.decide textarea{min-height:70px}.badge{padding:3px 10px;border-radius:99px;background:#eaf5ed;font-size:13px}
@media(max-width:650px){.kv{grid-template-columns:105px 1fr}}
</style><script src="jkh-look.js?v=33"></script></head><body><div class="wrap"><h1>مراجعة طلبات المتطوعين</h1><p class="small">للموظفين المخولين (مدير النظام أو الباحث الاجتماعي). القرار والسبب يظهران للمتطوع عند المتابعة بالرقم القومي، والمقبول يُضاف تلقائيًا إلى قائمة المتطوعين.</p>
<section id="login" class="card"><h2>تسجيل دخول الموظف</h2><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" onclick="load()">دخول وعرض الطلبات</button><div id="loginMsg" class="small"></div></section>
<section id="dash" class="hidden"><div class="card"><div class="row"><h2 style="flex:1;margin:0">طلبات المتطوعين</h2><button class="secondary" onclick="load(true)">🔄 تحديث</button><button class="secondary" onclick="exportCsv()">تصدير المقبولين CSV</button><button class="secondary" onclick="logout()">خروج</button></div><div id="chips" class="chips"></div></div><div id="flash" class="hidden"></div><section id="detail" class="card hidden"></section><div id="tables"></div></section></div>
<script>
const URL_=(window.JKH_SUPABASE_URL||"https://fpujicazthxvfodgjyui.supabase.co").replace(/\/$/,""),KEY=(window.JKH_SUPABASE_ANON_KEY||"sb_publishable_LKc8ByQL58bEH674K1f5pA_oyAy44Ol");
const G=[["تحت المراجعة","⏳ تحت المراجعة"],["مطلوب تعديل","✏️ مطلوب تعديل"],["مقبول","✅ المقبولون"],["مرفوض","❌ المرفوضون"]];
const el=id=>document.getElementById(id);function inMain(){try{return window.parent!==window&&typeof window.parent.addVolunteerFromRequest==="function"}catch(e){return false}}async function syncAccepted(){if(!inMain())return;for(const x of R.filter(r=>r.status==="مقبول")){try{await window.parent.addVolunteerFromRequest(x)}catch(e){}}}let R=[],openId=null;
const mk=(t,x,c)=>{const n=document.createElement(t);if(x!==undefined)n.textContent=x;if(c)n.className=c;return n};
function flash(t,e){const f=el("flash");f.textContent=t;f.className=e?"err":"";f.classList.remove("hidden")}
async function rpc(fn,a){const r=await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(a)});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error((d&&d.message)||"تعذر تنفيذ العملية");return d}
const cred=()=>({p_u:el("username").value.trim(),p_p:el("password").value});
async function exch(){const pw=el("password");if(pw.dataset.tok||/^jkh_[0-9a-f]{48}$/.test(pw.value))return;let d=null;try{d=await rpc("login_staff_session",{p_username:el("username").value.trim(),p_password:pw.value})}catch(e){return}if(d&&d.locked)throw Error("محاولات دخول خاطئة كثيرة، انتظر 15 دقيقة.");if(d&&d.token){pw.value=d.token;pw.dataset.tok="1"}}
async function load(m){try{await exch();R=await rpc("volunteer_staff_list",cred());await syncAccepted();el("login").classList.add("hidden");el("dash").classList.remove("hidden");render();if(m)flash("تم التحديث ("+R.length+" طلب)")}catch(e){if(el("dash").classList.contains("hidden"))el("loginMsg").textContent=e.message;else flash(e.message,true)}}
function logout(){el("password").value="";delete el("password").dataset.tok;R=[];el("dash").classList.add("hidden");el("login").classList.remove("hidden")}
const fmt=d=>d?new Date(d).toLocaleDateString("ar-EG"):"";
function render(){const ch=el("chips"),box=el("tables");ch.innerHTML="";box.innerHTML="";
 for(const [st,title] of G){const l=R.filter(x=>x.status===st);const c=mk("span",title,"chip");c.appendChild(mk("b",String(l.length)));ch.appendChild(c);
  const s=mk("section",undefined,"card");s.appendChild(mk("h3",title+" ("+l.length+")"));if(!l.length){s.appendChild(mk("div","لا توجد طلبات.","small"));box.appendChild(s);continue}
  const w=mk("div",undefined,"tbl"),t=mk("table"),h=mk("tr");for(const n of["م","رقم الطلب","الاسم","الهاتف","الرقم القومي","المجالات","التاريخ","إجراء"])h.appendChild(mk("th",n));t.appendChild(mk("thead")).appendChild(h);const tb=mk("tbody");
  l.forEach((x,i)=>{const p=x.payload||{},tr=mk("tr");for(const v of[String(i+1),x.code,p.name||"",p.phone||"",p.national_id||"",(p.activities||[]).join("، "),fmt(x.created_at)])tr.appendChild(mk("td",v));const td=mk("td"),b=mk("button",st==="تحت المراجعة"?"فتح والرد":"عرض / تعديل القرار");b.onclick=()=>open(x.id);td.appendChild(b);tr.appendChild(td);tb.appendChild(tr)});
  t.appendChild(tb);w.appendChild(t);s.appendChild(w);box.appendChild(s)}}
function open(id){const x=R.find(r=>r.id===id);openId=id;const p=x.payload||{},d=el("detail");d.innerHTML="";d.classList.remove("hidden");
 const top=mk("div",undefined,"row");top.append(mk("h2",(p.name||"")+" — "+x.code),mk("span",x.status,"badge"));const cl=mk("button","إغلاق","secondary");cl.onclick=()=>d.classList.add("hidden");top.appendChild(cl);d.appendChild(top);
 const L={national_id:"الرقم القومي",education:"المستوى التعليمي",address:"العنوان",phone:"المحمول",whatsapp:"WhatsApp",other_orgs:"جمعيات تطوع فيها",activities:"الأنشطة",activities_other:"نشاط آخر",monthly50:"تبرع شهري 50 جنيه",days:"أيام التطوع",reason:"سبب التطوع"};
 const kv=mk("div",undefined,"kv");for(const k in L){let v=p[k];if(Array.isArray(v))v=v.join("، ");if(!v)continue;kv.append(mk("b",L[k]),mk("span",String(v)))}d.appendChild(kv);const dl=mk("div",undefined,"row");for(const [k,t] of [["id_front","📎 صورة البطاقة (وجه)"],["id_back","📎 صورة البطاقة (ظهر)"]]){if(p[k]){const a=mk("a",t);a.href=p[k];a.target="_blank";a.rel="noopener";a.style.margin="6px 10px";dl.appendChild(a)}}d.appendChild(dl);const wb=mk("button","📲 رسالة واتساب للمتطوع");wb.className="secondary";wb.onclick=()=>waMsg(x);d.appendChild(wb);
 const dec=mk("div",undefined,"decide"),sel=mk("select");for(const s of["مقبول","مرفوض","مطلوب تعديل","تحت المراجعة"])sel.appendChild(mk("option",s));sel.value=x.status;
 const ta=mk("textarea");ta.placeholder="سبب القبول أو الرفض أو التعديل المطلوب (مطلوب) — يظهر للمتطوع";ta.value=x.reply||"";
 const sv=mk("button","حفظ القرار والرد");sv.onclick=async()=>{if(!ta.value.trim())return flash("اكتب الرد أولًا.",true);sv.disabled=true;try{await rpc("volunteer_staff_decide",{...cred(),p_id:x.id,p_status:sel.value,p_reply:ta.value.trim()});d.classList.add("hidden");await load();flash("تم الحفظ — الطلب الآن في: "+sel.value+(sel.value==="مقبول"&&inMain()?" — وأُضيف تلقائيًا إلى قائمة المتطوعين.":""));{const y=R.find(r=>r.id===x.id);if(y&&confirm("فتح واتساب لإرسال الرد للمتطوع؟"))waMsg(y)}}catch(e){flash(e.message,true)}finally{sv.disabled=false}};
 dec.append(mk("label","القرار"),sel,mk("label","الرد"),ta,sv);d.appendChild(dec);d.scrollIntoView({behavior:"smooth"})}
function waMsg(x){const p=x.payload||{},site=new URL("volunteer.html",location.href).href;
 try{if(inMain()&&window.parent.WaCenter){const pre={"مقبول":"قبول طلب تطوع","مرفوض":"رفض طلب تطوع","مطلوب تعديل":"طلب تعديل بيانات متطوع"}[x.status]||"ترحيب";
  window.parent.WaCenter.pick([{key:"vol"+x.id,name:p.name||"",phone:p.whatsapp||p.phone||"",vars:{"الاسم":p.name||"","رقم_الطلب":x.code,"الرد":x.reply||"","رابط_المتابعة":site}}],{group:"المتطوعون",pre});return}}catch(e){}
 let t="السلام عليكم ورحمة الله "+(p.name||"")+"،\nمعك جمعية الخير للجميع بخصوص طلب التطوع رقم "+x.code+".\n";
 if(x.status==="مقبول")t+="يسعدنا إبلاغك بقبول طلبك وانضمامك لفريق المتطوعين. "+(x.reply?x.reply+"\n":"")+"سنتواصل معك لتحديد النشاط المناسب. شكرًا لك.";
 else if(x.status==="مرفوض")t+="نعتذر عن عدم قبول الطلب حاليًا."+(x.reply?"\nالسبب: "+x.reply:"")+"\nشاكرين لك رغبتك في التطوع.";
 else if(x.status==="مطلوب تعديل")t+="مطلوب تعديل بعض البيانات: "+(x.reply||"")+"\nتابع طلبك وعدّله من الرابط (بالرقم القومي): "+site;
 else t+="طلبك قيد المراجعة وسنوافيك بالرد قريبًا. للمتابعة: "+site;
 const d=String(p.whatsapp||p.phone||"").replace(/\D/g,"");if(!d)return flash("لا يوجد رقم واتساب لهذا المتطوع",true);
 const n=d.startsWith("00")?d.slice(2):d.startsWith("0")?"20"+d.slice(1):d.startsWith("20")?d:"20"+d;
 window.open("https://wa.me/"+n+"?text="+encodeURIComponent(t),"_blank")}
function exportCsv(){const a=R.filter(x=>x.status==="مقبول");if(!a.length)return flash("لا يوجد مقبولون.",true);const rows=[["رقم الطلب","الاسم","الرقم القومي","المحمول","الواتساب","الأنشطة","الأيام"]].concat(a.map(x=>{const p=x.payload||{};return[x.code,p.name,p.national_id,p.phone,p.whatsapp,(p.activities||[]).join(" - "),p.days]}));
 const csv="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c||"").replace(/"/g,'""')+'"').join(",")).join("\n");const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));l.download="volunteers.csv";l.click()}
try{const c=window.parent!==window&&window.parent.__inboxCred;if(c){el("username").value=c.u;el("password").value=c.p;load()}}catch(e){}
</script></body></html>
