name: Build apps (Android APK + Windows)
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copy web files into the app
        run: |
          rm -rf jkh_apk_project/app/src/main/assets/www
          mkdir -p jkh_apk_project/app/src/main/assets/www
          cp -r jkh_cloud/web/. jkh_apk_project/app/src/main/assets/www/
      - name: Build debug APK
        run: gradle -p jkh_apk_project assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JKH-Android-APK
          path: jkh_apk_project/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Copy web files into the app
        shell: pwsh
        run: Copy-Item -Path jkh_cloud/web -Destination jkh_windows_project/web -Recurse
      - name: Build installer + portable
        working-directory: jkh_windows_project
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JKH-Windows
          path: |
            jkh_windows_project/dist/*.exe
